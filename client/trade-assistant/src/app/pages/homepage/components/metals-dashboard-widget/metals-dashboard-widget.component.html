<div class="metals-widget">

  <div class="header">
    <h3>
      Precious Metals
    </h3>
  </div>


  @if (loading()) {

  <div class="loading">
    Loading metals...
  </div>

  }


  @if (error()) {

  <div class="error">
    {{ error() }}
  </div>

  }



  @if (!loading() && metals().length) {


  <div class="metal-list">


    @for (metal of metals(); track metal.symbol) {


    <div class="metal-card">


      <div class="icon">
        <img [src]="getIcon(metal.symbol)" [alt]="metal.name" />
      </div>

      <div class="info">

        <div class="name">
          {{ metal.name }}
        </div>


        <div class="symbol">
          {{ metal.symbol }}
        </div>


      </div>



      <div class="price">

        <div class="value">
          {{ formatValue(metal.value) }}
        </div>


        <div class="unit">
          USD / g
        </div>

      </div>



    </div>


    }


  </div>


  <div class="updated">

    Updated:
    {{ formatDate(metals()[0].timestamp) }}

  </div>


  }


</div>
