<ng-container *ngIf="isLoading; else content">
  <app-loading-spinner message="Loading... The first load may take up to 2 minutes because we are using a free service. Thank you for your patience.
">
  </app-loading-spinner>
</ng-container>


<ng-template #content>
  <div class="homepage-section">

    <app-crypto-dashboard-widget></app-crypto-dashboard-widget>
    
    <div class="widgets-container">

        <app-forex-dashboard-widget></app-forex-dashboard-widget>

        <app-metals-widget></app-metals-widget>

    </div>



    <app-news-scroller></app-news-scroller>

</div>
  <div *ngIf="productsList.length; else noProducts" class="product-card">
    <app-product-card *ngFor="let product of productsList" [product]="product">
    </app-product-card>
  </div>
  <ng-template #noProducts>
    <p>No products to display</p>
  </ng-template>
</ng-template>
